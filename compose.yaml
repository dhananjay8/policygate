# podman compose up  (or: podman-compose up)
# Postgres + central authorization-service + demo-billing-service (remote mode).
name: policygate

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: authz
      POSTGRES_PASSWORD: authz
      POSTGRES_DB: authz
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U authz']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  authorization-service:
    build:
      context: .
      dockerfile: apps/authorization-service/Containerfile
    environment:
      PORT: '3100'
      AUTHZ_PERSISTENCE: memory # set to 'prisma' to use Postgres
      DATABASE_URL: postgresql://authz:authz@postgres:5432/authz
      AUTHZ_DECISION_LOGGING: 'true'
    ports:
      - '3100:3100'
    depends_on:
      postgres:
        condition: service_healthy

  demo-billing-service:
    build:
      context: .
      dockerfile: apps/demo-billing-service/Containerfile
    environment:
      PORT: '3200'
      AUTHZ_MODE: remote
      AUTHZ_EVALUATOR_URL: http://authorization-service:3100
      AUTHZ_DECISION_LOGGING: 'true'
    ports:
      - '3200:3200'
    depends_on:
      - authorization-service

volumes:
  pgdata:
